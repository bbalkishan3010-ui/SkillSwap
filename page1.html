<head>
  <title>SkillSwap</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">

  <!-- Navbar -->
  <nav class="flex justify-between items-center p-4 bg-white shadow">
    <h1 class="text-2xl font-bold text-green-600">SkillSwap</h1>
    <div class="space-x-4">
      <a href="#" class="text-gray-700">Login</a>
      <a href="#" class="bg-green-600 text-white px-4 py-2 rounded">Sign Up</a>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="text-center py-20 bg-green-50">
    <h2 class="text-4xl font-bold mb-4">Exchange Skills, Not Money</h2>

  <!-- Categories -->

      <div class="bg-white p-6 shadow rounded">Video Editing</div>

    </div>
  </section>
